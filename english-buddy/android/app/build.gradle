plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'it.execlingo.app'
    compileSdk 36

    defaultConfig {
        applicationId "it.execlingo.app"
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName "1.0"
        resValue "string", "app_name", "ExecLingo"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("EXECLINGO_KEYSTORE") ?: "keystore.jks")
            storePassword System.getenv("EXECLINGO_KEYSTORE_PASSWORD")
            keyAlias System.getenv("EXECLINGO_KEY_ALIAS") ?: "execlingo"
            keyPassword System.getenv("EXECLINGO_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
}
