name: Buddy notifications

# Hourly trigger for the notification scheduler. Vercel's Hobby plan only
# allows daily crons, so GitHub Actions provides the hourly cadence (the
# vercel.json daily cron remains as a backup).
#
# The bearer secret lives in a repository secret (Settings -> Secrets and
# variables -> Actions -> New repository secret, named CRON_SECRET) and must
# match the CRON_SECRET environment variable on Vercel.

on:
  schedule:
    - cron: "7 5-20 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call notification scheduler
        run: |
          curl -fsS --max-time 90 -X POST "https://www.execlingo.it/api/cron/notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
